<!-- ============================================================================
     HAZEY FACELIFT — LOADER (PRODUKTION)

     RÄTT FÄLT: Nyehandel-admins SEPARATA JavaScript-fält (Layout ▸ Hantera ▸
     "JavaScript" — INTE Kodläge-modalens <HEAD>-flik, INTE footer/body-sloten).
     Head-fältet äger Google Fonts + Trustpilot-widgeten och ska ALDRIG
     innehålla en Hazey-loader — de två fälten har separata, icke
     överlappande ansvar. JavaScript-fältet ska bara innehålla DENNA
     loader, ingenting annat.

     VID MIGRATION TILL EN NY TEMA-INSTANS: om JavaScript-fältet redan
     innehåller en äldre loader (t.ex. den tidigare kontraktorns
     `Oliverforss8/hazey-storefront`-pekare) ska HELA det gamla innehållet
     TAS BORT och ERSÄTTAS av den här snutten — inte kompletteras. Två
     samtidiga loaders i samma fält kör två separata, konkurrerande
     `initFooter()`/`initX()`-pass mot samma DOM (bekräftat orsak till
     tidigare förvirrande testresultat, se STATUS.md "Viktig sidoupptäckt").
     En instans = exakt en Hazey-loader i JavaScript-fältet, aldrig fler.

     Den laddar hazey.min.js externt från jsDelivr (GitHub-pinnad tagg) → ingen
     64 KB-gräns, ingen mangling. Ersätter den tidigare inklistrade hazey.min-koden.

     SLÄPP EN NY VERSION:
       1. Ändra i hazey.html/hazey.css → bygg om hazey.min.js
       2. git commit + git tag vX.Y.Z + git push --tags
       3. Byt vX.Y.Z + integrity-hashen nedan (hash = ny release)
          integrity: sha384-$(openssl dgst -sha384 -binary hazey.min.js | openssl base64 -A)
       4. Klistra in HELA denna uppdaterade fil i JavaScript-fältet igen
          (ersätter den föregående versionen av loadern, inte Head-fältet)
     ============================================================================ -->
<script>
(function () {
  var s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/gh/vilmerwahlberg-netizen/hazey-storefront@v1.1.0-rc1/hazey.min.js";
  s.crossOrigin = "anonymous";
  s.integrity = "sha384-W3SX9DJ2GCK+DvC/pNQY1AjjlUmAeovRTPXERpAY/YAKt1hAlU4VRV8VY4eeHY30";
  document.head.appendChild(s);
})();
</script>
