    function getCsrfToken() {
      var m = document.querySelector('meta[name="csrf-token"]');
      return m ? m.content : "";
    }

    function getXsrfToken() {
      var match = document.cookie.match(/(?:^|;\s*)XSRF-TOKEN=([^;]+)/);
      return match ? decodeURIComponent(match[1]) : "";
    }

    function apiHeaders() {
      return {
        "Content-Type": "application/json",
        Accept: "application/json",
        "X-Requested-With": "XMLHttpRequest",
        "X-CSRF-TOKEN": getCsrfToken(),
        "X-XSRF-TOKEN": getXsrfToken(),
      };
    }

    function openCartSidebar() {
      fetch("/frontend-api/cart", {
        credentials: nhSO,
        headers: apiHeaders(),
      }).then(function () {
        var cartBtn = document.getElementById("cart-button");
        if (cartBtn) cartBtn.click();
      });
    }

    /* Add a variant to the cart through the platform's OWN Vuex action
       (cart/addVariant {product_variant_id, quantity, meta}) — captured from
       the product page's real buy button. This updates the cart badge AND
       slides the cart drawer open reactively, so it shows up live with NO
       page refresh. Fallback (if the store isn't exposed): POST the cart
       endpoint + open the drawer; last resort, the synthetic add button. */
    function nhAddToCart(variantId, packageSize, done) {
      var payload = {
        product_variant_id: Number(variantId),
        quantity: 1,
        meta: null,
      };
      var st = window.storeVue && window.storeVue.$store;
      if (st && st._actions && st._actions["cart/addVariant"]) {
        var pr;
        try {
          pr = st.dispatch("cart/addVariant", payload);
        } catch (e) {
          pr = null;
        }
        if (pr && typeof pr.then === "function") {
          pr.then(function () { if (done) done(true); })
            .catch(function () { if (done) done(false); });
          return;
        }
        if (done) done(true);
        return;
      }
      // Fallback: no Vuex store available → POST then open the slide-out cart.
      fetch("/frontend-api/cart/item", {
        method: "POST",
        credentials: nhSO,
        headers: apiHeaders(),
        body: JSON.stringify(payload),
      })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json().catch(function () { return null; });
        })
        .then(function () {
          openCartSidebar();
          if (done) done(true);
        })
        .catch(function () {
          try {
            var vb = document.createElement("button");
            vb.className = "button buy add-to-cart";
            vb.setAttribute("data-id", String(variantId));
            vb.setAttribute("data-quantity", "1.0");
            vb.setAttribute("data-package-size", String(packageSize || 1));
            vb.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0;";
            document.body.appendChild(vb);
            vb.click();
            setTimeout(function () { if (vb.parentNode) vb.parentNode.removeChild(vb); }, 700);
          } catch (e) {}
          if (done) done(false);
        });
    }

      overlay.addEventListener("click", function (e) {
        if (e.target === overlay) nhCloseModal();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") nhCloseModal();
      });
      nhModalEl = overlay;
      return overlay;
    }

      var cur = data.variantId;
      var ps = data.packageSize;

      // Image + name come from the clicked card (already branded + correct).
      var imgSrc = "", name = "";
      if (card) {
        var im = card.querySelector(".product-card__image img");
        if (im) imgSrc = im.currentSrc || im.src || "";
        var nm = card.querySelector(".details .name") || card.querySelector(".name");
        if (nm) name = nm.textContent.trim();
      }
      function priceFor(vid) {
        var f = data.variants.filter(function (x) { return x.variantId === vid; })[0];
        return (f && f.price) || data.priceText || "";
      }
      var opts = data.variants
        .map(function (v) {
          return (
            '<option value="' + v.variantId + '"' +
            (v.disabled ? " disabled" : "") +
            (v.variantId === cur ? " selected" : "") +
            ">" + v.name + "</option>"
          );
        })
        .join("");
      modal.innerHTML =
        '<button class="nh-qa-close" type="button" aria-label="Stäng">×</button>' +
        '<div class="nh-qa-head">' +
        (imgSrc ? '<div class="nh-qa-thumb"><img src="' + imgSrc + '" alt=""></div>' : "") +
        '<div class="nh-qa-meta">' +
        (name ? '<div class="nh-qa-name">' + name + "</div>" : "") +
        '<div class="nh-qa-price">' + priceFor(cur) + "</div>" +
        "</div>" +
        "</div>" +
        '<label class="nh-qa-label">Välj variant</label>' +
        '<select class="nh-qa-select">' + opts + "</select>" +
        '<button class="nh-qa-add-btn" type="button">Lägg i varukorg</button>';
      var sel = modal.querySelector(".nh-qa-select");
      var addBtn = modal.querySelector(".nh-qa-add-btn");
      var priceEl = modal.querySelector(".nh-qa-price");
      sel.addEventListener("change", function () {
        var val = parseInt(sel.value, 10);
        var f = data.variants.filter(function (x) { return x.variantId === val; })[0];
        if (f) {
          cur = f.variantId;
          ps = f.packageSize;
          if (priceEl) priceEl.textContent = priceFor(cur);
        }
      });
      addBtn.addEventListener("click", function () {
        if (addBtn.disabled) return;
        addBtn.disabled = true;
        addBtn.textContent = "Lägger till…";
        nhAddToCart(cur, ps, function () {
          addBtn.textContent = "✓ Tillagd";
          setTimeout(nhCloseModal, 650);
        });
      });
      modal.querySelector(".nh-qa-close").addEventListener("click", nhCloseModal);
      overlay.classList.add("is-open");
      document.documentElement.style.overflow = "hidden";
    }

    /* =============================================
		 SLIDESHOW
		 ============================================= */
    function initSlideshow() {
      if (slideshowInitialized) return;
      // .slideshow-component renderas endast i layout/preview-läge, ta bort eller ersätt med 'template-components__slideshow' om du behöver specificiteten
      // Split selector (no descendant-combinator string) — the deploy pipeline
      // has mangled ".template-components__slideshow .slideshow" into an invalid
      // selector; querying in two steps avoids that fragile string.
      var nhSlideRoot = document.querySelector(".template-components__slideshow");
      var wrapper = nhSlideRoot ? nhSlideRoot.querySelector(".slideshow") : null;
      if (!wrapper) return;
      slideshowInitialized = true;

      var whiteTextLock = false;
      function forceWhiteText() {
        if (whiteTextLock) return;
        whiteTextLock = true;
        // Hero-style: dark text on the light overlay (no white, no shadow)
        wrapper
          .querySelectorAll(".slideshow__slides__slide h2")
          .forEach(function (el) {
            el.style.setProperty("color", "#23231d", "important");
            el.style.setProperty("text-shadow", "none", "important");
          });
        wrapper
          .querySelectorAll(".slideshow__slides__slide p:not(.nh-tp-score)")
          .forEach(function (el) {
            el.style.setProperty("color", "#23231d", "important");
          });
        setTimeout(function () {
          whiteTextLock = false;
        }, 100);
      }
      forceWhiteText();
      setTimeout(forceWhiteText, 200);
      setTimeout(forceWhiteText, 600);
      setTimeout(forceWhiteText, 1200);
      setTimeout(forceWhiteText, 2500);

      var textObserver = new MutationObserver(function () {
        forceWhiteText();
      });
      wrapper
        .querySelectorAll(
          ".slideshow__slides__slide h2, .slideshow__slides__slide p:not(.nh-tp-score)",
        )
        .forEach(function (el) {
          textObserver.observe(el, {
            attributes: true,
            attributeFilter: ["style"],
          });
        });

      function forceButtonStyles() {
        wrapper.querySelectorAll(".button.is-primary").forEach(function (btn) {
          btn.style.setProperty("text-decoration", "none", "important");
          btn.style.setProperty("text-align", "center", "important");
          btn.style.setProperty("background", "#D2691E", "important");
          btn.style.setProperty("color", "#ffffff", "important");
          btn.style.setProperty("border-width", "1px", "important");
          btn.style.setProperty("border-style", "solid", "important");
          btn.style.setProperty("border-color", "#D2691E", "important");
          btn.style.setProperty("border-image", "none", "important");
          btn.style.setProperty("border-radius", "2px", "important");
          btn.style.setProperty("box-shadow", "none", "important");
          btn.style.setProperty("padding", "11px 28px", "important");
          btn.style.setProperty("font-size", "0.85rem", "important");
          btn.style.setProperty("font-weight", "600", "important");
          btn.style.setProperty("letter-spacing", "0.1em", "important");
          btn.style.setProperty("text-transform", "uppercase", "important");
          btn.style.setProperty("display", "inline-flex", "important");
          btn.style.setProperty("align-items", "center", "important");
          btn.style.setProperty("justify-content", "center", "important");
          btn.style.setProperty("line-height", "1", "important");
          btn.style.setProperty("cursor", "pointer", "important");
        });
      }
      forceButtonStyles();
      setTimeout(forceButtonStyles, 300);
      setTimeout(forceButtonStyles, 800);

      var slidesWrapper =
        wrapper.querySelector(".slideshow__slides-wrapper") || wrapper;
      if (window.getComputedStyle(slidesWrapper).position === "static") {
        slidesWrapper.style.position = "relative";
      }

      var bar = document.createElement("div");
      bar.className = "nh-progress-bar";
      slidesWrapper.appendChild(bar);

      // Trustpilot block removed — strip any previously injected ones.
      wrapper
        .querySelectorAll(".nh-tp-inline")
        .forEach(function (el) { el.parentNode.removeChild(el); });

      var animFrame = null;
      var startTime = null;

      function startProgress() {
        cancelAnimationFrame(animFrame);
        startTime = performance.now();
        bar.style.transition = "none";
        bar.style.width = "0%";
        (function tick(now) {
          var pct = Math.min(((now - startTime) / DURATION) * 100, 100);
          bar.style.width = pct + "%";
          if (pct < 100) animFrame = requestAnimationFrame(tick);
        })(startTime);
      }

      function markActive(slide) {
        wrapper
          .querySelectorAll(".slideshow__slides__slide")
          .forEach(function (s) {
            s.classList.remove("nh-active");
          });
        slide.classList.add("nh-active");
        forceWhiteText();
        forceButtonStyles();
        var content = slide.querySelector(".slideshow__slides__slide__content");
        if (content) {
          content.style.animation = "none";
          void content.offsetWidth;
          content.style.animation = "";
        }
        startProgress();
      }

      function checkActiveSlide() {
        wrapper
          .querySelectorAll(".slideshow__slides__slide")
          .forEach(function (slide) {
            var t = slide.style.transform;
            if (t === "translateX(0px)" || t === "translate(0px, 0px)") {
              if (!slide.classList.contains("nh-active")) markActive(slide);
            }
          });
      }

      var observer = new MutationObserver(checkActiveSlide);
      wrapper
        .querySelectorAll(".slideshow__slides__slide")
        .forEach(function (s) {
          observer.observe(s, { attributes: true, attributeFilter: ["style"] });
        });

      var pauseBtn = document.getElementById("pause");
      if (pauseBtn) {
        pauseBtn.addEventListener("click", function () {
          var nowPaused = pauseBtn.getAttribute("aria-pressed") === "true";
          if (nowPaused) cancelAnimationFrame(animFrame);
          else startProgress();
        });
      }

      checkActiveSlide();
      setTimeout(checkActiveSlide, 300);

      /* ---- Autoplay (5s) + dot navigators + pause-on-hover (added) ----
         We drive the slide transforms; the observer above then marks the
         active slide, re-runs the entrance animation and restarts the
         progress bar — so autoplay reuses all existing logic. */
      var apSlides = Array.prototype.slice.call(
        wrapper.querySelectorAll(".slideshow__slides__slide"),
      );
      if (apSlides.length > 1) {
        var cur = 0;
        apSlides.forEach(function (s, i) {
          var t = s.style.transform;
          if (t === "translateX(0px)" || t === "translate(0px, 0px)") cur = i;
        });
        function apW() {
          return (
            apSlides[0].getBoundingClientRect().width ||
            slidesWrapper.clientWidth ||
            window.innerWidth
          );
        }
        function apPlace(s, x, animate) {
          s.style.transition = animate
            ? "transform 0.6s cubic-bezier(0.22,1,0.36,1)"
            : "none";
          s.style.transform = "translateX(" + x + "px)";
        }
        // queue every non-active slide just off the right edge
        apSlides.forEach(function (s, i) {
          if (i !== cur) apPlace(s, apW(), false);
        });

        // dot navigators
        var dots = document.createElement("div");
        dots.className = "nh-slider-dots";
        apSlides.forEach(function (s, i) {
          var dot = document.createElement("button");
          dot.type = "button";
          dot.className = "nh-slider-dot" + (i === cur ? " is-active" : "");
          dot.setAttribute("aria-label", "Gå till slide " + (i + 1));
          dot.addEventListener("click", function () {
            apGoTo(i);
            apStart();
          });
          dots.appendChild(dot);
        });
        slidesWrapper.appendChild(dots);
        function apSyncDots() {
          var ds = dots.querySelectorAll(".nh-slider-dot");
          for (var i = 0; i < ds.length; i++)
            ds[i].classList.toggle("is-active", i === cur);
        }

        function apGoTo(n) {
          if (n === cur || n < 0 || n >= apSlides.length) return;
          var w = apW();
          apPlace(apSlides[cur], -w, true); // current exits left
          var incoming = apSlides[n];
          if (incoming.style.transform !== "translateX(" + w + "px)") {
            apPlace(incoming, w, false); // ensure it starts off the right
            void incoming.offsetWidth;
          }
          apPlace(incoming, 0, true); // incoming slides in
          var prev = cur;
          cur = n;
          apSyncDots();
          setTimeout(function () {
            if (cur !== prev) apPlace(apSlides[prev], apW(), false); // requeue right
          }, 650);
        }
        function apNext() {
          apGoTo((cur + 1) % apSlides.length);
        }

        var apTimer = null;
        function apStart() {
          apStop();
          apTimer = setInterval(apNext, DURATION);
        }
        function apStop() {
          if (apTimer) {
            clearInterval(apTimer);
            apTimer = null;
          }
        }
        wrapper.addEventListener("mouseenter", apStop);
        wrapper.addEventListener("mouseleave", apStart);
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) apStop();
          else apStart();
        });
        apStart();
      }
    }

    function fetchProductData(productUrl) {
      return fetch(productUrl, { credentials: nhSO })
        .then(function (r) {
          return r.text();
        })
        .then(function (html) {
          var match = html.match(/window\.visitor\.viewProduct\('(\d+)'\)/);
          if (!match) throw new Error("No product ID found");
          var productId = parseInt(match[1]);

          return fetch("/frontend-api/product/state", {
            method: "POST",
            credentials: nhSO,
            headers: apiHeaders(),
            body: JSON.stringify({
              product_id: productId,
              variant_ids: [null],
            }),
          })
            .then(function (r) {
              return r.json();
            })
            .then(function (data) {
              var sv = data.selected_variant;
              var variants = (data.product && data.product.variants) || [];
              var variantOptions = [];

              if (
                variants.length > 1 &&
                data.product &&
                data.product.options &&
                data.product.options.length > 0
              ) {
                variants.forEach(function (v) {
                  var label = v.sku
                    ? String(v.sku).split(" - ").pop().trim()
                    : "Variant " + v.id;
                  variantOptions.push({
                    name: label,
                    variantId: v.id,
                    packageSize: v.package_size || 1,
                    price: (v.price && v.price.formatted_price) || "",
                    disabled: v.active === false,
                  });
                });
              }

              return {
                productId: productId,
                variantId: sv.id,
                packageSize: sv.package_size || 1,
                priceText: (sv.price && sv.price.formatted_price) || "",
                variants: variantOptions,
              };
            });
        });
    }

    function renderPanel(panel, data, productUrl, onClose) {
      var hasVariants = data.variants.length > 1;
      var currentVariantId = data.variantId;
      var currentPackageSize = data.packageSize;

      var html =
        '<button class="nh-qa-close" type="button" aria-label="Stäng">×</button>';
      if (hasVariants) {
        html +=
          '<span class="nh-qa-label">Välj variant</span><select class="nh-qa-select">';
        data.variants.forEach(function (v) {
          html +=
            '<option value="' +
            v.variantId +
            '"' +
            (v.disabled ? " disabled" : "") +
            ">" +
            v.name +
            "</option>";
        });
        html += "</select>";
      }
      html +=
        '<button class="nh-qa-add-btn" type="button">Lägg i varukorg</button>';
      panel.innerHTML = html;

      var addBtn = panel.querySelector(".nh-qa-add-btn");
      var select = panel.querySelector(".nh-qa-select");

      if (select) {
        select.addEventListener("change", function () {
          var val = parseInt(this.value);
          var found = data.variants.filter(function (v) {
            return v.variantId === val;
          })[0];
          if (found) {
            currentVariantId = found.variantId;
            currentPackageSize = found.packageSize;
          }
        });
      }

      addBtn.addEventListener("click", function () {
        if (addBtn.disabled) return;
        addBtn.disabled = true;
        addBtn.textContent = "...";
        addBtn.style.background = "rgba(210,105,30,0.5)";
        addBtn.style.color = "#ffffff";

        nhAddToCart(currentVariantId, currentPackageSize, function () {
          addBtn.textContent = "✓ Tillagd";
          addBtn.style.background = "#ffffff";
          addBtn.style.color = "#2d7a4e";
          setTimeout(function () {
            if (onClose) onClose();
            setTimeout(openCartSidebar, 100);
          }, 900);
        });
      });

      var closeBtn = panel.querySelector(".nh-qa-close");
      if (closeBtn) {
        closeBtn.addEventListener("click", function (e) {
          e.stopPropagation();
          if (onClose) onClose();
        });
      }
    }

    // Group a card's ribbons (Nyhet / sale) into one flex row across the top
    function wrapRibbons(card) {
      if (card.__nhRibbons) return;
      var ribbons = [];
      for (var i = 0; i < card.children.length; i++) {
        var ch = card.children[i];
        if (ch.classList && ch.classList.contains("ribbon")) ribbons.push(ch);
      }
      if (!ribbons.length) return;
      card.__nhRibbons = true;
      var row = document.createElement("div");
      row.className = "nh-ribbon-row";
      card.insertBefore(row, card.firstChild);
      ribbons.forEach(function (r) {
        row.appendChild(r);
      });
    }

    function initCard(card) {
      wrapRibbons(card);
      if (card.__qaInit) return;
      card.__qaInit = true;

      var imageLink = card.querySelector("a.product-card__image");
      if (!imageLink) return;
      var productUrl = imageLink.getAttribute("href");
      if (!productUrl) return;

      var wrapEl = card.querySelector(".details-wrapper") || card;
      var hasVariants = !!card.querySelector(".has-variants");
      var buyBtn = document.createElement("button");
      buyBtn.type = "button";
      buyBtn.className = "nh-card-buy";
      buyBtn.textContent = hasVariants ? "Välj & köp" : "Lägg i korg";

      function setBusy(txt) {
        buyBtn.__busy = true;
        if (buyBtn.__orig == null) buyBtn.__orig = buyBtn.textContent;
        buyBtn.textContent = txt;
        buyBtn.style.opacity = "0.75";
      }
      function clearBusy() {
        buyBtn.style.opacity = "";
        if (buyBtn.__orig != null) buyBtn.textContent = buyBtn.__orig;
        buyBtn.__busy = false;
      }

      // Product WITHOUT variants → add directly in ONE click (no popup).
      function addDirect() {
        if (buyBtn.__busy) return;
        setBusy("Lägger till…");
        fetchProductData(productUrl)
          .then(function (data) {
            nhAddToCart(data.variantId, data.packageSize, function () {
              buyBtn.style.opacity = "";
              buyBtn.textContent = "✓ Tillagd";
              setTimeout(clearBusy, 1600);
            });
          })
          .catch(function () {
            clearBusy();
            window.location.href = productUrl;
          });
      }

      // Product WITH variants → open the centered "Välj alternativ" modal.
      function openVariants() {
        if (buyBtn.__busy) return;
        setBusy("Laddar…");
        fetchProductData(productUrl)
          .then(function (data) {
            clearBusy();
            if (!data.variants || data.variants.length < 2) {
              nhAddToCart(data.variantId, data.packageSize); // no real variants
              return;
            }
            nhOpenVariantModal(data, card);
          })
          .catch(function () {
            clearBusy();
            window.location.href = productUrl;
          });
      }

      buyBtn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        if (hasVariants) openVariants();
        else addDirect();
      });
      wrapEl.appendChild(buyBtn);
    }

    function initAllCards() {
      /* bara ".product-card" (en klass) — fältet äter mellanslaget i
         descendant-selektorer (".pl-list .product-card" → kompound som matchar
         inget). Alla produktkort ska ändå få köp-knapp; initCard är idempotent. */
      document.querySelectorAll(".product-card").forEach(initCard);
    }
    window.nhInitCards = initAllCards;

    function initCategoryPage() {
      // Collapse empty category-menu sidebar block
      var menu = document.getElementById("category-menu");
      if (menu && !menu.children.length) {
        var sec = menu.closest(".category-sidebar");
        if (sec) sec.style.display = "none";
      }
    }

    function initReadMore() {
      var desc = document.querySelector(".category-description");
      var btn = document.querySelector(".readmore__toggle button");
      var content = document.getElementById("read-more-content");
      if (!desc || !btn || !content || btn.__rmInit) return;
      btn.__rmInit = true;

      content.style.overflow = "hidden";

      // Use the embedded image as the decorative bg, then drop it from the text
      var heroImg = content.querySelector("img");
      if (heroImg && heroImg.src && !desc.style.getPropertyValue("--cat-bg-img")) {
        desc.style.setProperty("--cat-bg-img", 'url("' + heroImg.src + '")');
      }
      content.querySelectorAll("img").forEach(function (i) { i.remove(); });

      // Strip WordPress [shortcode] artifacts and collect text nodes
      var walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null);
      var textNodes = [];
      while (walker.nextNode()) textNodes.push(walker.currentNode);
      textNodes.forEach(function (n) {
        n.nodeValue = n.nodeValue.replace(/\[[^\]]*\]/g, "");
      });

      // Build a clean lead line (first real sentence) shown under the title
      var container = desc.querySelector(".container");
      if (container && !container.querySelector(".nh-cat-lead")) {
        var lead = "";
        for (var k = 0; k < textNodes.length; k++) {
          var t = textNodes[k].nodeValue.replace(/\s+/g, " ").trim();
          if (t.length > 40) { lead = t; break; }
        }
        if (lead.length > 200) lead = lead.slice(0, 197).replace(/\s+\S*$/, "") + "…";
        if (lead) {
          var p = document.createElement("p");
          p.className = "nh-cat-lead";
          p.textContent = lead;
          var title = container.querySelector("h1.title");
          var readmore = container.querySelector(".readmore");
          // wrap the lead + full article in a clean card ("box")
          var box = document.createElement("div");
          box.className = "nh-cat-box";
          if (title) title.insertAdjacentElement("afterend", box);
          box.appendChild(p);
          if (readmore) box.appendChild(readmore);
        }
      }

      // Full article is hidden by default; the toggle reveals it
      function setExpanded(on) {
        if (on) {
          content.style.maxHeight = content.scrollHeight + "px";
          btn.setAttribute("aria-expanded", "true");
          btn.textContent = "Visa mindre";
        } else {
          content.style.maxHeight = "0px";
          btn.setAttribute("aria-expanded", "false");
          btn.textContent = "Läs mer";
        }
      }
      setExpanded(false);

      btn.addEventListener("click", function () {
        setExpanded(btn.getAttribute("aria-expanded") !== "true");
      });
    }

    // PDP: move the variant <select> (#product-variants) INTO the buy box,
    // right above the qty/add row, so it reads stock → variant → qty → add.
    // Idempotent: once it lives inside the box, contains() short-circuits.
    function initPdpVariant() {
      var box = document.querySelector(".meta-usp-buy-container");
      var variants = document.querySelector("#product-variants, .variants");
      if (!box || !variants) return;
      if (box.contains(variants)) return;
      variants.classList.add("nh-in-buybox");
      var bc = box.querySelector(".buy-controls");
      if (bc) box.insertBefore(variants, bc);
      else box.appendChild(variants);
    }

    // PDP: turn each variant <select> (Vit/Svart, doft, strain…) into a row of
    // tappable boxes — the MMSports "Välj storlek" look, hazey-styled. The native
    // <select> stays in the DOM (Vue keeps it in sync); we hide its .control via
    // the nh-has-vbox class and mirror clicks back onto the select + fire a native
    // change so Vuex updates SKU/price/stock. Guard on the select element itself so
    // a Vue re-render (new <select>) rebuilds automatically. Mangle-safe: only
    // single-class/tag querySelectors (no descendant-space), innerHTML-free.
    function initVariantBoxes() {
      var vroot = document.getElementById("product-variants");
      if (!vroot) return;
      var fields = vroot.querySelectorAll(".field");
      if (!fields.length) return;
      vroot.classList.add("nh-has-vbox");
      Array.prototype.forEach.call(fields, function (field) {
        var sel = field.querySelector("select");
        if (!sel || sel.__nhVbox) return;
        var opts = sel.querySelectorAll("option");
        if (opts.length < 2) { return; }
        sel.__nhVbox = true;
        var row = document.createElement("div");
        row.className = "nh-vbox-row";
        Array.prototype.forEach.call(opts, function (o) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "nh-vbox" + (o.selected ? " is-active" : "");
          b.setAttribute("data-val", o.value);
          if (o.disabled) b.setAttribute("disabled", "disabled");
          b.textContent = (o.textContent || "").trim();
          b.addEventListener("click", function () {
            if (o.disabled) return;
            sel.value = o.value;
            sel.dispatchEvent(new Event("change", { bubbles: true }));
            Array.prototype.forEach.call(row.querySelectorAll(".nh-vbox"), function (x) {
              x.classList.remove("is-active");
            });
            b.classList.add("is-active");
          });
          row.appendChild(b);
        });
        field.appendChild(row);
        sel.addEventListener("change", function () {
          Array.prototype.forEach.call(row.querySelectorAll(".nh-vbox"), function (x) {
            x.classList.toggle("is-active", x.getAttribute("data-val") === sel.value);
          });
        });
      });
    }

    // PDP: paint the top rating widget in .price-features. The platform sets
    // .stars-inner width:0% (no filled stars) and hides the count on mobile
    // (.count.is-hidden-mobile) -> the rating is invisible. We read the
    // aggregate from JSON-LD (fallback: average of the review list's star
    // widths), paint our amber nh-stars markup AND set the native width as a
    // belt-and-suspenders fallback. Mangle-safe: only chained single-class
    // querySelector, no regex, all innerHTML uses nh- classes.
    function nhPdpRatingValue() {
      // 1) JSON-LD: aggregateRating.ratingValue (+ reviewCount), maybe in @graph.
      var scripts = document.querySelectorAll('script[type="application/ld+json"]');
      for (var s = 0; s < scripts.length; s++) {
        var raw = scripts[s].textContent;
        if (!raw) continue;
        var obj;
        try { obj = JSON.parse(raw); } catch (e) { continue; }
        var stack = [obj];
        while (stack.length) {
          var node = stack.shift();
          if (!node || typeof node !== "object") continue;
          if (node.aggregateRating && node.aggregateRating.ratingValue != null) {
            var v = parseFloat(node.aggregateRating.ratingValue);
            var c = parseInt(node.aggregateRating.reviewCount != null
              ? node.aggregateRating.reviewCount
              : node.aggregateRating.ratingCount, 10);
            if (!isNaN(v)) return { v: v, c: isNaN(c) ? 0 : c };
          }
          if (node["@graph"] && node["@graph"].length) {
            for (var g = 0; g < node["@graph"].length; g++) stack.push(node["@graph"][g]);
          }
          if (node.length) { for (var a = 0; a < node.length; a++) stack.push(node[a]); }
        }
      }
      // 2) Fallback: average the review list's star widths ("100%" -> 5.0).
      var rev = document.querySelector(".product-reviews");
      if (rev) {
        var inners = rev.querySelectorAll(".stars-inner");
        if (inners.length) {
          var sum = 0, n = 0;
          for (var i = 0; i < inners.length; i++) {
            var w = parseFloat(inners[i].style.width);
            if (!isNaN(w)) { sum += w / 100 * 5; n++; }
          }
          if (n) return { v: sum / n, c: n };
        }
      }
      return null;
    }

    function initPdpRating() {
      var pf = document.querySelector(".price-features");
      var rating = pf && pf.querySelector(".rating");
      if (!rating) return;
      if (rating.__nhRat) return;
      var data = nhPdpRatingValue();
      if (!data) return;
      rating.__nhRat = true;

      // Belt-and-suspenders: fill the native .stars-inner width so the native
      // glyphs fill even if our markup is mangled away.
      var inner = rating.querySelector(".stars-inner");
      if (inner) inner.style.width = (data.v / 5 * 100) + "%";

      // Keep the link to the reviews; paint our amber nh-stars markup into it.
      var target = rating.querySelector("a") || rating;
      if (!target.getAttribute("href")) target.setAttribute("href", "#" + "product-reviews");
      var full = Math.round(data.v * 2) / 2;
      var fullCount = Math.floor(full);
      var hasHalf = full - fullCount >= 0.5;
      var h = '<span class="nh-stars" title="' + data.v + ' av 5">';
      for (var i = 1; i <= 5; i++) {
        var cls = "nh-star";
        if (i <= fullCount) cls += " is-on";
        else if (i === fullCount + 1 && hasHalf) cls += " is-on nh-star--half";
        h += '<span class="' + cls + '">★</span>';
      }
      h += "</span>";
      var cnt = data.c
        ? '<span class="nh-stars__count">' + data.c + " omdömen</span>"
        : "";
      target.innerHTML = h + cnt;
    }

    // PDP: the platform lets customers SEE reviews but not WRITE them (the
    // per-product review-submission form is backend-locked). Give a real path
    // to leave a review via Trustpilot. Chained single-class querySelector (no
    // descendant-space, mode-3 safe); innerHTML carries nh- classes → self-
    // repair-safe; the full https URL survives the field (plain URLs aren't
    // mangled). Guard by our own element so it re-injects if the PDP re-renders.
    function initPdpReviewCta() {
      var pp = document.getElementById("product-page");
      if (!pp) return;
      if (pp.querySelector(".nh-review-cta")) return;
      // Anchor on .product-detail (rendered early + always visible) — NOT the
      // reviews list, which lives in a COLLAPSED accordion (height:0) where the
      // CTA would be hidden. Insert as a sibling right after the buy area.
      var anchor = pp.querySelector(".product-detail") ||
                   pp.querySelector(".meta-usp-buy-container");
      if (!anchor) return;
      var host = anchor.parentNode;
      if (!host) return;
      var box = document.createElement("div");
      box.className = "nh-review-cta";
      box.innerHTML =
        '<span class="nh-review-cta__txt">Har du köpt denna produkt? Dela din upplevelse.</span>' +
        '<a class="nh-review-cta__btn" href="https://www.trustpilot.com/evaluate/hazey.se" target="_blank" rel="noopener">Lämna ett omdöme</a>';
      host.insertBefore(box, anchor.nextSibling);
    }

    // PDP: gör den långa "short-description" till en kort teaser + "Läs mer".
    // Plattformen dumpar HELA sammanfattningen (rubrik + stycken + spec-lista +
    // en inbäddad #product-information-länk) i köp-kolumnen → alldeles för lång.
    // Vi wrappar innehållet i .nh-sd-body, klampar det (fade + max-height) och
    // lägger en toggle som fäller ut in-place. Den fulla "Beskrivning"-accordionen
    // finns kvar nedanför. Idempotent (guard: .nh-sd-body finns redan) + själv-
    // läkande vid Vue-omrender (ny node saknar wrappern → wrappas om).
    function initPdpShortDesc() {
      var pp = document.getElementById("product-page");
      if (!pp) return;
      var sd = pp.querySelector(".short-description");
      if (!sd) return;
      if (sd.querySelector(".nh-sd-body")) return; // redan wrappad
      // Klampa bara när det finns mer än en teaser att vinna på (annars lämna).
      if (sd.scrollHeight < 280) return;

      // Wrappa allt innehåll i en klamp-body så toggeln kan ligga UTANFÖR
      // overflow:hidden och alltid synas.
      var body = document.createElement("div");
      body.className = "nh-sd-body nh-sd-clamped";
      while (sd.firstChild) body.appendChild(sd.firstChild);
      sd.appendChild(body);

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "nh-sd-toggle";
      btn.setAttribute("aria-expanded", "false");
      btn.textContent = "Läs mer";
      sd.appendChild(btn);

      btn.addEventListener("click", function () {
        var clamped = body.classList.toggle("nh-sd-clamped");
        btn.setAttribute("aria-expanded", clamped ? "false" : "true");
        btn.textContent = clamped ? "Läs mer" : "Visa mindre";
        if (clamped) {
          try { sd.scrollIntoView({ block: "nearest" }); } catch (e) {}
        }
      });
    }

    // PDP: MÄNGDRABATT-visning i köp-boxen. Det RIKTIGA avdraget sätts i
    // Nyehandel-admin (kvantitetsrabatt per produkt); det här visar bara
    // erbjudandet + pris/styck och lyfter aktiv nivå när antalet ändras.
    // JUSTERA nivåerna här (antal + procent) — eller sätt window.NH_BULK_TIERS.
    // Mangle-safe: chained single-class querySelector (ingen descendant-space),
    // innerHTML bär nh- klasser (self-repair), regex-LITERALER (överlever fältet).
    function initBulkPricing() {
      var pp = document.getElementById("product-page");
      if (!pp) return;
      var box = pp.querySelector(".meta-usp-buy-container");
      if (!box) return;
      var pf = pp.querySelector(".price-features");
      if (!pf) return;
      var priceEl = pf.querySelector(".price");
      if (!priceEl) return;
      // container (create once, keep position before .buy-controls)
      var wrap = box.querySelector(".nh-bulk");
      if (!wrap) {
        wrap = document.createElement("div");
        wrap.className = "nh-bulk";
        var bc = box.querySelector(".buy-controls");
        if (bc && bc.parentNode) bc.parentNode.insertBefore(wrap, bc);
        else box.appendChild(wrap);
      }

      function num(s) {
        var t = (s || "").replace(/[^\d.,]/g, "").replace(/\s/g, "");
        if (t.indexOf(",") > -1) t = t.replace(/\./g, "").replace(/,/g, ".");
        var v = parseFloat(t);
        return isNaN(v) ? 0 : v;
      }
      function baseP() {
        var ins = priceEl.querySelector("ins") || priceEl;
        return num(ins.textContent);
      }
      function kr(n) { return Math.round(n) + " kr"; }

      // Prefer the platform's native tier table (#product-pricing-table) for
      // EXACT prices; fall back to computing from tierCfg + base price.
      function readTiers() {
        var table = pp.querySelector("#product-pricing-table");
        var rows = table ? table.querySelectorAll("tr") : null;
        var out = [];
        if (rows && rows.length) {
          var base = 0;
          Array.prototype.forEach.call(rows, function (tr, idx) {
            var tds = tr.querySelectorAll("td");
            if (tds.length < 2) return;
            var m = (tds[0].textContent || "").match(/\d+/);
            var q = m ? parseInt(m[0], 10) : (out.length ? 0 : 1);
            var p = num(tds[1].textContent);
            if (!p) return;
            if (!out.length) base = p;
            out.push({ qty: q, price: p, pct: base ? Math.round((1 - p / base) * 100) : 0 });
          });
          if (out.length) { out.__native = table; return out; }
        }
        // No native tier table → only show boxes if tiers were EXPLICITLY set
        // (never invent a discount that the product doesn't actually have).
        var cfg = window.NH_BULK_TIERS;
        var b = baseP();
        if (!b || !cfg || !cfg.length) return null;
        out.push({ qty: 1, price: b, pct: 0 });
        cfg.forEach(function (t) {
          out.push({ qty: t.qty, price: b * (1 - t.pct / 100), pct: t.pct });
        });
        return out;
      }

      function currentQty() {
        var ai = box.querySelector(".amount-input");
        var i = ai ? ai.querySelector(".input") : null;
        return i ? (parseInt(i.value, 10) || 1) : 1;
      }
      // Reach a target qty by clicking the native +/- stepper (Vue-wired, so the
      // cart quantity truly updates — safer than writing .value directly).
      function setQty(t) {
        var ai = box.querySelector(".amount-input");
        if (!ai) return;
        var i = ai.querySelector(".input");
        var cur = i ? (parseInt(i.value, 10) || 1) : 1;
        var btns = ai.querySelectorAll(".button");
        if (!btns.length) return;
        var b = (t - cur) > 0 ? btns[btns.length - 1] : btns[0];
        var n = Math.abs(t - cur);
        for (var k = 0; k < n; k++) { if (b) b.click(); }
      }
      function highlight() {
        var q = currentQty(), active = 0;
        Array.prototype.forEach.call(wrap.querySelectorAll(".nh-tier"), function (el) {
          var dq = parseInt(el.getAttribute("data-q"), 10) || 0;
          if (q >= dq) active = Math.max(active, dq);
        });
        Array.prototype.forEach.call(wrap.querySelectorAll(".nh-tier"), function (el) {
          el.classList.toggle("is-active", (parseInt(el.getAttribute("data-q"), 10) || 0) === active);
        });
      }
      function render() {
        var tiers = readTiers();
        if (!tiers || tiers.length < 2) { wrap.style.display = "none"; wrap.__sig = ""; return; }
        wrap.style.display = "";
        var sig = tiers.map(function (t) { return t.qty + ":" + Math.round(t.price) + ":" + t.pct; }).join("|");
        if (sig !== wrap.__sig) {
          wrap.__sig = sig;
          var h = '<div class="nh-bulk__head">Köp fler — betala mindre</div><div class="nh-tier-grid">';
          tiers.forEach(function (t) {
            h += '<button type="button" class="nh-tier' + (t.pct > 0 ? " is-deal" : "") + '" data-q="' + t.qty + '">'
              + (t.pct > 0 ? '<span class="nh-tier__badge">−' + t.pct + "%</span>" : "")
              + '<span class="nh-tier__qty">' + t.qty + " st</span>"
              + '<span class="nh-tier__price">' + kr(t.price) + "/st</span>"
              + "</button>";
          });
          h += "</div>";
          wrap.innerHTML = h;
        }
        if (tiers.__native) tiers.__native.style.display = "none";
        highlight();
      }

      render();
      if (!box.__nhBulkWired) {
        box.__nhBulkWired = true;
        wrap.addEventListener("click", function (e) {
          var t = e.target;
          while (t && t !== wrap && !(t.classList && t.classList.contains("nh-tier"))) t = t.parentNode;
          if (!t || t === wrap) return;
          var q = parseInt(t.getAttribute("data-q"), 10);
          if (q) setQty(q);
          setTimeout(highlight, 40);
        });
        box.addEventListener("input", highlight);
        box.addEventListener("click", function () { setTimeout(highlight, 60); });
        try { new MutationObserver(render).observe(priceEl, { childList: true, subtree: true, characterData: true }); } catch (e) {}
      }
    }

    // CART: add a Swish trust row under the checkout button in the slide-out
    // cart (#cartAside). Guard by checking for our own row (not a flag) so it
    // re-injects if the Vue cart re-renders and wipes it. innerHTML carries
    // nh- classes → self-repair-safe.
    function initCartSwish() {
      // chained (getElementById + compound class) — NO descendant-space selector,
      // which the field would mangle (mode 3: "#cartAside .footer" → compound).
      var ca = document.getElementById("cartAside");
      if (!ca) return;
      var foot = ca.querySelector(".section.footer") || ca.querySelector(".footer");
      if (!foot) return;
      if (foot.querySelector(".nh-cart-swish")) return;
      var buy = foot.querySelector(".button.buy");
      var row = document.createElement("div");
      row.className = "nh-cart-swish";
      row.innerHTML =
        '<span class="nh-cart-swish__txt">Trygg betalning med</span>' +
        '<span class="nh-cart-swish__chip"><img src="https://www.hazey.se/wp-content/uploads/2023/04/Swish-Logo-Secondary-Light-BG.png" alt="Swish" loading="lazy"></span>';
      if (buy && buy.parentNode) buy.parentNode.insertBefore(row, buy.nextSibling);
      else foot.appendChild(row);
    }

    // CHECKOUT: the hosted Vue checkout ships a near-black "Fortsätt"/submit
    // button (and others). Recolor any near-black button to brand green —
    // EXCEPT Klarna's own buttons (must stay black). Class-agnostic so it
    // survives the platform's markup; each button is processed once.
    function initCheckout() {
      if (!document.body.classList.contains("checkout-page")) return;
      var btns = document.querySelectorAll(
        "main.checkout button, .checkout-page button, main.checkout .button, .checkout-page .button",
      );
      btns.forEach(function (btn) {
        if (btn.__nhCo) return;
        var cls = (typeof btn.className === "string" ? btn.className : "") + " " + (btn.id || "");
        // Skip Klarna-branded buttons (brand requirement → keep black)
        if (/klarna/i.test(cls)) return;
        if (/klarna/i.test(btn.innerText || "")) return;
        if (btn.querySelector('[class*="klarna" i], img[src*="klarna" i]')) return;
        var cs = getComputedStyle(btn);
        var m = cs.backgroundColor.match(/(\d+),\s*(\d+),\s*(\d+)(?:,\s*([0-9.]+))?/);
        if (!m) return;
        var a = m[4] === undefined ? 1 : parseFloat(m[4]);
        if (a < 0.5) return;
        var r = +m[1], g = +m[2], b = +m[3];
        if (r < 45 && g < 45 && b < 45) {
          btn.__nhCo = true;
          btn.style.setProperty("background-color", "#323d25", "important");
          btn.style.setProperty("color", "#ffffff", "important");
          btn.style.setProperty("border-color", "#323d25", "important");
        }
      });
    }

    /* =============================================
		 INIT
		 ============================================= */

    /* Trust-bar (topbar USP) → scrolling marquee on mobile. Builds a
       duplicated track so all three USPs loop seamlessly; CSS shows the
       marquee only on phones and hides the static .usp there. */
    function initTopbarMarquee() {
      var nhSh = document.getElementById("store-header");
      var topbar = nhSh ? nhSh.querySelector(".topbar") : null;
      if (!topbar) return;
      var usp = topbar.querySelector(".usp");
      if (!usp || topbar.querySelector(".nh-topbar-marquee")) return;
      var items = Array.prototype.slice
        .call(usp.querySelectorAll("li"))
        .map(function (li) {
          return li.textContent.trim();
        })
        .filter(Boolean);
      if (!items.length) return;
      var wrap = document.createElement("div");
      wrap.className = "nh-topbar-marquee";
      wrap.setAttribute("aria-hidden", "true");
      var track = document.createElement("div");
      track.className = "nh-topbar-marquee__track";
      for (var c = 0; c < 2; c++) {
        items.forEach(function (t) {
          var span = document.createElement("span");
          span.className = "nh-topbar-marquee__item";
          span.textContent = t;
          track.appendChild(span);
        });
      }
      wrap.appendChild(track);
      usp.parentNode.insertBefore(wrap, usp.nextSibling);
    }

    /* RESILIENS: deploy-pipelinen har vid flera tillfällen korrumperat enstaka
       rader (trunkering, editor-överskrivning, och nu mellanslag runt bindestreck
       så en selektor blev ogiltig). Om EN init kastar fel ska resten ändå köra.
       Vi wrappar därför varje init i try/catch (funktionerna är hoistade, så de
       går att skriva om här innan de anropas). */
    /* ── Review-stjärnor på produktkort ──────────────────────────────
       Plattformens kort har en tom <div class="rating"> men fyller den aldrig,
       och det finns inget rating-API. Betyget ligger bara i varje produktsidas
       JSON-LD (aggregateRating). Vi hämtar därför per kort LAZY (bara när det
       scrollas in), cachar i sessionStorage och har ett hårt tak, så servern
       inte hamras. Produkter utan omdöme får inga stjärnor. */
    var nhRatCache = {};
    var nhRatQueue = [];
    var nhRatActive = 0;
    var nhRatDone = 0;
    var nhRatIO = null;
    var NH_RAT_MAX = 60;
    function nhRatSlug(url) { var m = url.match(/\/sv\/products\/([a-z0-9-]+)/i); return m ? m[1] : url; }
    function nhRatGet(slug) {
      if (slug in nhRatCache) return nhRatCache[slug];
      try { var s = sessionStorage.getItem("nhrat:" + slug); if (s != null) { nhRatCache[slug] = s === "0" ? false : JSON.parse(s); return nhRatCache[slug]; } } catch (e) {}
      return undefined;
    }
    function nhRatSet(slug, val) { nhRatCache[slug] = val; try { sessionStorage.setItem("nhrat:" + slug, val ? JSON.stringify(val) : "0"); } catch (e) {} }
    function nhRatPaint(rEl, data) {
      if (!data || !rEl) return;
      var full = Math.round(data.v), h = '<span class="nh-stars" title="' + data.v + ' av 5">';
      for (var i = 1; i <= 5; i++) h += '<span class="nh-star' + (i <= full ? " is-on" : "") + '">★</span>';
      rEl.innerHTML = h + '</span><span class="nh-stars__count">(' + data.c + ")</span>";
      rEl.classList.add("nh-rating-shown");
    }
    function nhRatPump() {
      while (nhRatActive < 4 && nhRatQueue.length && nhRatDone < NH_RAT_MAX) {
        var job = nhRatQueue.shift();
        var cached = nhRatGet(job.slug);
        if (cached !== undefined) { nhRatPaint(job.rEl, cached); continue; }
        nhRatActive++; nhRatDone++;
        (function (job) {
          fetch(job.url, { credentials: nhSO })
            .then(function (r) { return r.text(); })
            .then(function (html) {
              var m = html.match(/"aggregateRating":\{[^}]*?"ratingValue":\s*"?([0-9.]+)"?[^}]*?"reviewCount":\s*"?([0-9]+)"?/);
              var data = m ? { v: parseFloat(m[1]), c: parseInt(m[2], 10) } : false;
              nhRatSet(job.slug, data); nhRatPaint(job.rEl, data);
            })
            .catch(function () {})
            .then(function () { nhRatActive--; nhRatPump(); });
        })(job);
      }
    }
    function nhRatQueueCard(card) {
      if (card.__nhRat) return;
      var rEl = card.querySelector(".rating");
      if (!rEl) return;
      var link = card.querySelector("a.product-card__image") || card.querySelector('a[href*="/sv/products/"]');
      if (!link) return;
      var url = link.getAttribute("href");
      if (!url) return;
      card.__nhRat = true;
      nhRatQueue.push({ rEl: rEl, url: url, slug: nhRatSlug(url) });
      nhRatPump();
    }
    function initCardRatings() {
      var cards = document.querySelectorAll(".product-card");
      if (!cards.length) return;
      if (!("IntersectionObserver" in window)) { Array.prototype.forEach.call(cards, nhRatQueueCard); return; }
      if (!nhRatIO) {
        nhRatIO = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) { if (e.isIntersecting) { nhRatIO.unobserve(e.target); nhRatQueueCard(e.target); } });
        }, { rootMargin: "300px" });
      }
      Array.prototype.forEach.call(cards, function (card) {
        if (card.__nhRatObs) return;
        card.__nhRatObs = true;
        if (card.querySelector(".rating")) nhRatIO.observe(card);
      });
    }

    function nhSafe(fn) {
      return function () { try { return fn.apply(this, arguments); } catch (e) {} };
    }
    initSlideshow = nhSafe(initSlideshow);
    initCardRatings = nhSafe(initCardRatings);
    initTopbarMarquee = nhSafe(initTopbarMarquee);
    initAllCards = nhSafe(initAllCards);
    initReadMore = nhSafe(initReadMore);
    initCategoryPage = nhSafe(initCategoryPage);
    initKampanjer = nhSafe(initKampanjer);
    initProductSections = nhSafe(initProductSections);
    initAllProducts = nhSafe(initAllProducts);
    initBsListing = nhSafe(initBsListing);
    initUspBars = nhSafe(initUspBars);
    initHeroRotator = nhSafe(initHeroRotator);
    initSlideshowButtons = nhSafe(initSlideshowButtons);
    initTabs = nhSafe(initTabs);
    initFaq = nhSafe(initFaq);
    initTrustpilot = nhSafe(initTrustpilot);
    initPdpVariant = nhSafe(initPdpVariant);
    initVariantBoxes = nhSafe(initVariantBoxes);
    initPdpRating = nhSafe(initPdpRating);
    initPdpReviewCta = nhSafe(initPdpReviewCta);
    initPdpShortDesc = nhSafe(initPdpShortDesc);
    initBulkPricing = nhSafe(initBulkPricing);
    initCheckout = nhSafe(initCheckout);
    initCartSwish = nhSafe(initCartSwish);
    initFooter = nhSafe(initFooter);
    initHeaderScroll = nhSafe(initHeaderScroll);
    window.nhInitCards = initAllCards;

    new MutationObserver(function () {
      initSlideshow();
      initTopbarMarquee();
      initAllCards();
      initCardRatings();
      initReadMore();
      initCategoryPage();
      initKampanjer();
      initProductSections();
      initAllProducts();
      initBsListing();
      initUspBars();
      initHeroRotator();
      initSlideshowButtons();
      initTabs();
      initFaq();
      initTrustpilot();
      initPdpVariant();
      initVariantBoxes();
      initPdpRating();
      initPdpReviewCta();
      initPdpShortDesc();
      initBulkPricing();
      initCheckout();
      initCartSwish();
    }).observe(document.body, { childList: true, subtree: true });

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function () {
        initSlideshow();
        initAllCards();
        initReadMore();
        initCategoryPage();
        initKampanjer();
      });
    } else {
      initSlideshow();
      initAllCards();
      initCardRatings();
      initReadMore();
      initCategoryPage();
      initKampanjer();
      initProductSections();
      initAllProducts();
      initBsListing();
      initUspBars();
    }

    setTimeout(function () {
      initSlideshow();
      initTopbarMarquee();
      initAllCards();
      initCardRatings();
      initReadMore();
      initCategoryPage();
      initKampanjer();
      initProductSections();
      initAllProducts();
      initBsListing();
      initUspBars();
      initHeaderScroll();
      initHeroRotator();
      initSlideshowButtons();
      initTabs();
      initFaq();
      initTrustpilot();
      initPdpVariant();

    /* ── Custom Kampanjer (campaigns) loader ──
       The script lives here (global custom JS) because <script> tags pasted
       into an html-editor block are stripped and never run. The block only
       provides the markup with #nh-kampanjer-grid. */
    function initKampanjer() {
      var grid = document.getElementById("nh-kampanjer-grid");
      if (!grid || grid.__nhKampInit) return;
      grid.__nhKampInit = true;

      var MAX = 4;

      function isDiscounted(card) {
        return !!(
          card.querySelector(".price.has-comparison del") ||
          card.querySelector(".price del") ||
          card.querySelector(".ribbon.sale")
        );
      }

      // grid flattens two wrapper levels (display:contents), so the
      // .product-card must sit at .products > div > div > .product-card
      function mountCard(card) {
        card.querySelectorAll("img").forEach(function (img) {
          var ds = img.getAttribute("data-src") || img.getAttribute("data-original");
          if (ds && (!img.getAttribute("src") || /no-image|placeholder|data:/.test(img.getAttribute("src") || ""))) {
            img.setAttribute("src", ds);
          }
          img.removeAttribute("loading");
          img.classList.remove("lazy");
        });
        var outer = document.createElement("div");
        var inner = document.createElement("div");
        inner.appendChild(card);
        outer.appendChild(inner);
        return outer;
      }

      function paint(cards) {
        grid.innerHTML = "";
        if (!cards.length) {
          grid.innerHTML =
            '<div class="nh-pl-empty">Inga kampanjer just nu. ' +
            '<a href="/sv/categories/alla-produkter" style="color:#d2691e">Visa alla produkter →</a></div>';
          return;
        }
        cards.slice(0, MAX).forEach(function (c) {
          grid.appendChild(mountCard(c.cloneNode(true)));
        });
        if (window.nhInitCards) window.nhInitCards();
      }

      function scrape(url) {
        return fetch(url, { credentials: nhSO })
          .then(function (r) {
            if (!r.ok) throw new Error("HTTP " + r.status);
            return r.text();
          })
          .then(function (html) {
            var doc = new DOMParser().parseFromString(html, "text/html");
            return Array.from(
              doc.querySelectorAll(
                "#category-products .product-card, .pl-list .product-card, .product-card"
              )
            );
          });
      }

      function fromCategory(slug) {
        return scrape("/sv/categories/" + slug).then(function (cards) {
          var d = cards.filter(isDiscounted);
          if (d.length) return d;
          throw new Error("none");
        });
      }

      fromCategory("kampanjer")
        .catch(function () { return fromCategory("rea"); })
        .catch(function () {
          return scrape("/sv/categories/alla-produkter").then(function (cards) {
            return cards.filter(isDiscounted);
          });
        })
        .then(paint)
        .catch(function () {
          grid.innerHTML =
            '<div class="nh-pl-empty">Kunde inte ladda kampanjer. ' +
            '<a href="/sv/categories/alla-produkter" style="color:#d2691e">Visa alla produkter →</a></div>';
        });
    }

    /* ── Generic product-section loader ──
       Any .products grid with data-nh-source gets filled with products
       scraped from that category. Optional data-nh-limit (default 4) and
       data-nh-filter="discounted". Used by THC-A and any future sections. */
    function initProductSections() {
      var grids = document.querySelectorAll(".products[data-nh-source]");
      // Shared page cache: several sections on one page (e.g. Kampanjer has a
      // "discounted" + a "bestseller" grid) pull from the SAME category pages —
      // fetch each URL once and reuse. "" = failed/redirect (past last page).
      var pageCache = {};
      function fetchPage(url) {
        if (!pageCache[url]) {
          pageCache[url] = fetch(url, { credentials: nhSO })
            .then(function (r) { return (r.ok && !r.redirected) ? r.text() : ""; })
            .catch(function () { return ""; });
        }
        return pageCache[url];
      }
      Array.prototype.forEach.call(grids, function (grid) {
        if (grid.__nhSecInit) return;
        grid.__nhSecInit = true;

        var source = grid.getAttribute("data-nh-source") || "/sv/categories/alla-produkter";
        var limit = parseInt(grid.getAttribute("data-nh-limit") || "4", 10);
        var filter = grid.getAttribute("data-nh-filter") || "";

        function isDiscounted(c) {
          return !!(
            c.querySelector(".price.has-comparison del") ||
            c.querySelector(".price del") ||
            c.querySelector(".ribbon.sale")
          );
        }
        function mountCard(card) {
          card.querySelectorAll("img").forEach(function (img) {
            var ds = img.getAttribute("data-src") || img.getAttribute("data-original");
            if (ds && (!img.getAttribute("src") || /no-image|placeholder|data:/.test(img.getAttribute("src") || ""))) {
              img.setAttribute("src", ds);
            }
            img.removeAttribute("loading");
            img.classList.remove("lazy");
          });
          var outer = document.createElement("div");
          var inner = document.createElement("div");
          inner.appendChild(card);
          outer.appendChild(inner);
          return outer;
        }
        function paint(cards) {
          grid.innerHTML = "";
          if (!cards.length) {
            grid.innerHTML =
              '<div class="nh-pl-empty">Inga produkter just nu. ' +
              '<a href="' + source + '" style="color:#d2691e">Visa alla →</a></div>';
            return;
          }
          cards.slice(0, limit).forEach(function (c) {
            grid.appendChild(mountCard(c.cloneNode(true)));
          });
          if (window.nhInitCards) window.nhInitCards();
        }

        // When a filter is set (e.g. "discounted") the matching products can be
        // spread across MANY category pages — crawl up to 8 pages and collect them
        // ALL, so the Kampanjer page shows EVERY campaign, not just page 1's.
        // Unfiltered sections (e.g. Bästsäljare) keep the fast single-page behaviour.
        var crawlPages = filter ? 8 : 1;
        var base = source + (source.indexOf("?") < 0 ? "?" : "&") + "sort=in-stock";
        var pool = [];
        function cardsFromHtml(html) {
          var doc = new DOMParser().parseFromString(html, "text/html");
          return Array.prototype.slice.call(
            doc.querySelectorAll("#category-products .product-card, .pl-list .product-card, .product-card")
          );
        }
        // Fetch one page → its cards. Tolerant: a 301 past the last page (→ the
        // unpaginated list) or any error yields [] so it never contributes
        // duplicates or blocks the parallel batch.
        function grabCards(pg) {
          return fetchPage(base + "&page=" + pg).then(function (html) { return html ? cardsFromHtml(html) : []; });
        }
        // Highest ?page=N in page 1's pagination → only fetch pages that exist
        // (avoids the 301 over-crawl), capped at crawlPages.
        function lastPageFrom(html) {
          try {
            var links = new DOMParser().parseFromString(html, "text/html")
              .querySelectorAll('a[href*="page="]');
            var mx = 1;
            Array.prototype.forEach.call(links, function (a) {
              var m = (a.getAttribute("href") || "").match(/page=(\d+)/);
              if (m) { var n = parseInt(m[1], 10); if (n > mx) mx = n; }
            });
            return mx;
          } catch (e) { return 1; }
        }
        function render() {
          // Dedupe by product href — the category markup repeats each card
          // (desktop+mobile copies), so without this the same products appear
          // multiple times once we gather across pages.
          var seen = {}, uniq = [];
          pool.forEach(function (c) {
            var a = c.querySelector("a.product-card__image") || c.querySelector('a[href*="/sv/products/"]');
            var key = a && a.getAttribute("href");
            if (key && seen[key]) return;
            if (key) seen[key] = 1;
            uniq.push(c);
          });
          var cards = filter === "discounted" ? uniq.filter(isDiscounted) : uniq;
          // shuffle so it's not the same products every load (opt out: data-nh-order="fixed")
          if (grid.getAttribute("data-nh-order") !== "fixed") {
            for (var i = cards.length - 1; i > 0; i--) {
              var j = Math.floor(Math.random() * (i + 1));
              var tmp = cards[i]; cards[i] = cards[j]; cards[j] = tmp;
            }
          }
          paint(cards);
        }
        // Page 1 gives both the first batch AND the page count; fetch the rest in
        // PARALLEL. Was sequential (up to 8 back-to-back round-trips → ~6.5 s and
        // 3.8 MB on Kampanjer, incl. 301 over-crawl). Now: 1 + (last−1) concurrent,
        // only real pages.
        fetchPage(base + "&page=1")
          .then(function (html) {
            if (!html) throw new Error("no page 1");
            pool = cardsFromHtml(html);
            var last = Math.min(crawlPages, lastPageFrom(html));
            var rest = [];
            for (var pg = 2; pg <= last; pg++) rest.push(grabCards(pg));
            if (!rest.length) { render(); return; }
            Promise.all(rest).then(function (pages) {
              pages.forEach(function (cards) { if (cards && cards.length) pool = pool.concat(cards); });
              render();
            });
          })
          .catch(function () {
            if (pool.length) { render(); return; }
            grid.innerHTML =
              '<div class="nh-pl-empty">Kunde inte ladda produkter. ' +
              '<a href="' + source + '" style="color:#d2691e">Visa alla →</a></div>';
          });
      });
    }

    /* ── "Alla Produkter" section with load-more pagination ──
       Fills #nh-all-grid in batches; the "Visa fler" button loads the next
       category page and appends. Order is kept (no shuffle) so paging is stable. */
    function initAllProducts() {
      var grid = document.getElementById("nh-all-grid");
      if (!grid || grid.__nhAllInit) return;
      grid.__nhAllInit = true;

      var BATCH = parseInt(grid.getAttribute("data-nh-batch") || "12", 10);
      var moreBtn = document.getElementById("nh-all-more");
      var pool = [];
      var nextPage = 1;
      var noMore = false;
      var firstPaint = true;
      var busy = false;

      function mountCard(card) {
        card.querySelectorAll("img").forEach(function (img) {
          var ds = img.getAttribute("data-src") || img.getAttribute("data-original");
          if (ds && (!img.getAttribute("src") || /no-image|placeholder|data:/.test(img.getAttribute("src") || ""))) {
            img.setAttribute("src", ds);
          }
          img.removeAttribute("loading");
          img.classList.remove("lazy");
        });
        var outer = document.createElement("div");
        var inner = document.createElement("div");
        inner.appendChild(card);
        outer.appendChild(inner);
        return outer;
      }

      function fetchNextPage() {
        if (noMore) return Promise.resolve();
        var pg = nextPage++;
        return fetch("/sv/categories/alla-produkter?sort=in-stock&page=" + pg, { credentials: nhSO })
          .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
          .then(function (html) {
            var doc = new DOMParser().parseFromString(html, "text/html");
            var cards = Array.prototype.slice.call(doc.querySelectorAll(".product-card"));
            if (!cards.length) { noMore = true; return; }
            pool = pool.concat(cards);
          });
      }

      function appendBatch() {
        if (firstPaint) { grid.innerHTML = ""; firstPaint = false; }
        pool.splice(0, BATCH).forEach(function (c) {
          grid.appendChild(mountCard(c.cloneNode(true)));
        });
        if (window.nhInitCards) window.nhInitCards();
        if (moreBtn) moreBtn.style.display = (pool.length === 0 && noMore) ? "none" : "";
      }

      function loadMore() {
        if (busy) return;
        busy = true;
        (function step() {
          if (pool.length >= BATCH || noMore) { appendBatch(); busy = false; return; }
          fetchNextPage().then(step).catch(function () { noMore = true; appendBatch(); busy = false; });
        })();
      }

      if (moreBtn) {
        moreBtn.textContent = "Visa fler";
        moreBtn.addEventListener("click", loadMore);
      }
      loadMore();
    }

    /* ── Filterable "Alla produkter" listing ──
       #nh-bs-grid + a filter bar (#nh-bs-filters with .nh-pl-filter[data-cat])
       + a "Visa fler" button (#nh-bs-more). Clicking a chip switches the active
       category and reloads; "Visa fler" paginates within the active category.
       A token guards against stale fetches when the user switches fast. */
    function initBsListing() {
      var grid = document.getElementById("nh-bs-grid");
      if (!grid || grid.__nhBsInit) return;
      grid.__nhBsInit = true;

      var BATCH = parseInt(grid.getAttribute("data-nh-batch") || "12", 10);
      var moreBtn = document.getElementById("nh-bs-more");
      var countEl = document.getElementById("nh-bs-count");
      var filterBar = document.getElementById("nh-bs-filters");

      var cat = "alla-produkter";
      var pool = [], nextPage = 1, noMore = false, firstPaint = true, busy = false, token = 0;

      function mountCard(card) {
        card.querySelectorAll("img").forEach(function (img) {
          var ds = img.getAttribute("data-src") || img.getAttribute("data-original");
          if (ds && (!img.getAttribute("src") || /no-image|placeholder|data:/.test(img.getAttribute("src") || ""))) {
            img.setAttribute("src", ds);
          }
          img.removeAttribute("loading");
          img.classList.remove("lazy");
        });
        var outer = document.createElement("div");
        var inner = document.createElement("div");
        inner.appendChild(card);
        outer.appendChild(inner);
        return outer;
      }

      function skeletons(n) {
        var s = "";
        for (var i = 0; i < n; i++) {
          s += '<div><div><div class="nh-skel"><div class="nh-skel__img"></div>' +
               '<div class="nh-skel__line"></div><div class="nh-skel__line short"></div></div></div></div>';
        }
        return s;
      }

      function fetchNextPage(myToken) {
        if (noMore) return Promise.resolve();
        var pg = nextPage++;
        return fetch("/sv/categories/" + cat + "?sort=in-stock&page=" + pg, { credentials: nhSO })
          .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
          .then(function (html) {
            if (myToken !== token) return;
            var doc = new DOMParser().parseFromString(html, "text/html");
            var cards = Array.prototype.slice.call(doc.querySelectorAll(".product-card"));
            if (!cards.length) { noMore = true; return; }
            pool = pool.concat(cards);
          });
      }

      function appendBatch() {
        if (firstPaint) { grid.innerHTML = ""; firstPaint = false; }
        pool.splice(0, BATCH).forEach(function (c) {
          grid.appendChild(mountCard(c.cloneNode(true)));
        });
        var shown = grid.querySelectorAll(".product-card").length;
        if (countEl) countEl.textContent = shown ? ("Visar " + shown + " produkter") : "";
        if (window.nhInitCards) window.nhInitCards();
        if (moreBtn) moreBtn.style.display = (pool.length === 0 && noMore) ? "none" : "";
      }

      function loadMore() {
        if (busy) return;
        busy = true;
        var myToken = token;
        (function step() {
          if (myToken !== token) { busy = false; return; }
          if (pool.length >= BATCH || noMore) { appendBatch(); busy = false; return; }
          fetchNextPage(myToken).then(step).catch(function () { noMore = true; appendBatch(); busy = false; });
        })();
      }

      function switchTo(newCat) {
        token++;
        cat = newCat || "alla-produkter";
        pool = []; nextPage = 1; noMore = false; firstPaint = true; busy = false;
        grid.innerHTML = skeletons(BATCH < 8 ? BATCH : 8);
        if (moreBtn) moreBtn.style.display = "none";
        if (countEl) countEl.textContent = "";
        loadMore();
      }

      if (filterBar) {
        filterBar.addEventListener("click", function (e) {
          var btn = e.target.closest(".nh-pl-filter");
          if (!btn || !filterBar.contains(btn) || btn.classList.contains("is-active")) return;
          Array.prototype.forEach.call(filterBar.querySelectorAll(".nh-pl-filter"), function (b) {
            b.classList.remove("is-active");
          });
          btn.classList.add("is-active");
          switchTo(btn.getAttribute("data-cat"));
        });
      }
      if (moreBtn) {
        moreBtn.textContent = "Visa fler";
        moreBtn.addEventListener("click", loadMore);
      }
      loadMore();
    }

    /* Remove emojis from trust/USP bars across all pages (doc v3.1: emojis
       look unprofessional and glitch on Android). Clean text stays; CSS adds
       a consistent green checkmark. Covers the butik-grid band, the reusable
       USP bar and any [data-nh-usp] placeholder. */
    function stripUspEmojis() {
      var EMOJI = /[\u{1F000}-\u{1FAFF}\u{1F1E6}-\u{1F1FF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu;
      document
        .querySelectorAll(
          ".nh-cat-grid__usp span, .nh-usp__inner span, [data-nh-usp] span",
        )
        .forEach(function (el) {
          if (el.__nhNoEmoji) return;
          el.__nhNoEmoji = true;
          var cleaned = el.textContent
            .replace(EMOJI, "")
            .replace(/\s{2,}/g, " ")
            .trim();
          if (cleaned !== el.textContent) el.textContent = cleaned;
        });
    }

    /* ── Reusable trust / USP bar ──
       Turns any <div data-nh-usp></div> into a styled trust bar. Text lives
       here (one place → updates everywhere). Custom per-bar items: put your
       own <span>…</span> inside the placeholder and they're kept. */
    function initUspBars() {
      var DEFAULT = [
        "Fri frakt från 499 kr",

      ];
      document.querySelectorAll("[data-nh-usp]").forEach(function (el) {

        el.innerHTML =
          '<div class="nh-usp__inner">' +

    /* ── Header headroom — hide on scroll down, show on scroll up ──
       #store-header is position:fixed, so we just slide it out with a
       transform (CSS handles the 0.3s transition). Shows again near the
       top or as soon as the user scrolls up. */
    function initHeaderScroll() {
      var header = document.getElementById("store-header");
      if (!header || header.__nhScroll) return;
      header.__nhScroll = true;

      var last = window.pageYOffset || document.documentElement.scrollTop || 0;
      var ticking = false;

      function update() {
        var y = window.pageYOffset || document.documentElement.scrollTop || 0;
        var delta = y - last;
        if (y < 90) {
          header.classList.remove("nh-header-hidden");
        } else if (delta > 6) {
          header.classList.add("nh-header-hidden");
        } else if (delta < -6) {
          header.classList.remove("nh-header-hidden");
        }
        last = y;
        ticking = false;
      }

      window.addEventListener("scroll", function () {
        if (!ticking) { window.requestAnimationFrame(update); ticking = true; }
      }, { passive: true });
    }

    /* ── Hero rotating message carousel (Tershine-style) ──
       Title + subtext cycle every 5s; buttons + background stay static.
       Messages live in a hidden <ul class="nh-hero__messages"> in the block
       (no <script> needed there — those get stripped). */
    function initHeroRotator() {
      var root = document.getElementById("nh-hero-root");
      if (!root || root.__nhHero) return;
      var rotor = root.querySelector(".nh-hero__rotor");
      var titleEl = root.querySelector(".nh-hero__title");
      var subEl = root.querySelector(".nh-hero__sub");
      var lis = root.querySelectorAll(".nh-hero__messages li");
      if (!rotor || !titleEl || !subEl || !lis.length) return;
      root.__nhHero = true;

      var data = Array.prototype.map.call(lis, function (li) {
        return { title: li.getAttribute("data-title") || "", sub: li.getAttribute("data-sub") || "" };
      });
      var i = 0;
      function paint(n) { titleEl.innerHTML = data[n].title; subEl.innerHTML = data[n].sub; }
      paint(0);
      if (data.length < 2) return;

      setInterval(function () {
        rotor.classList.add("is-fading");
        setTimeout(function () {
          i = (i + 1) % data.length;
          paint(i);
          rotor.classList.remove("is-fading");
        }, 500);
      }, 5000);
    }

       The native slideshow component only renders one .action button.
       This swaps each slide's action area for two buttons (THCA outline +
       BÄSTSÄLJARE fill). Edit SLIDE_BTNS to change text/links. */
