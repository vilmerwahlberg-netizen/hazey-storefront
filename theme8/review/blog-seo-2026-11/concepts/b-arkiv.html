<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koncept B – Arkiv</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#23231d;--olive:#323d25;--olive2:#2a3320;--beige:#e4d1bf;--sand:#efe2cd;--paper:#f6efe3;--cta:#b5581f;--muted:#5f5848;--line:rgba(35,35,29,.14);--serif:"Iowan Old Style",Georgia,serif;--sans:"Instrument Sans",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--sans)}a{color:inherit}
.hdr{height:64px;display:flex;align-items:center;justify-content:center;font:600 20px var(--serif);color:#fff;background:var(--olive2)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
/* INDEX: mörkt arkivfält med sök + ämnen som "spårlista" */
.field{background:var(--olive);color:#fff;padding:52px 0 0}
.field .g{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end}
.field h1{margin:0;font:600 clamp(42px,6.4vw,84px)/.95 var(--serif);letter-spacing:-.02em}
.field p{margin:14px 0 0;color:rgba(255,255,255,.78);max-width:440px}
.srch{display:flex;border-bottom:2px solid var(--beige)}.srch input{flex:1;background:none;border:0;color:#fff;font:400 20px var(--sans);padding:12px 0}.srch input::placeholder{color:rgba(255,255,255,.6)}
.tabs{display:flex;gap:2px;margin-top:36px;overflow-x:auto}
.tabs button{flex:none;border:0;background:rgba(255,255,255,.08);color:#fff;font:600 14px var(--sans);padding:12px 16px;border-radius:6px 6px 0 0;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--paper);color:var(--ink)}.tabs small{opacity:.7;margin-left:6px;font-weight:400}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:34px 0}
.feat a{text-decoration:none;display:grid;grid-template-rows:auto 1fr;gap:12px}
.feat .t{aspect-ratio:16/10;border-radius:6px;overflow:hidden;background:var(--sand)}.feat img{width:100%;height:100%;object-fit:cover}
.feat h2{margin:0;font:600 24px/1.15 var(--serif)}
.yr{display:grid;grid-template-columns:140px 1fr;gap:20px;border-top:2px solid var(--ink);padding:18px 0 28px}
.yr>h2{margin:0;font:600 44px/1 var(--serif);color:var(--olive)}
.trk{list-style:none;margin:0;padding:0}
.trk a{display:grid;grid-template-columns:70px 1fr auto;gap:16px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none}
.trk a:hover h3{text-decoration:underline;text-decoration-color:var(--cta)}
.trk h3{margin:0;font:600 18px/1.3 var(--sans)}.d{font:400 13px var(--sans);color:var(--muted)}
.tag{font:700 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--olive);background:var(--beige);border-radius:3px;padding:4px 7px}
/* ARTIKEL */
.ahead{background:var(--olive);color:#fff;padding:44px 0 0}
.ahead .crumb{font:400 13px var(--sans);color:rgba(255,255,255,.7)}
.ahead h1{font:600 clamp(34px,5vw,64px)/1.03 var(--serif);margin:14px 0 18px;max-width:900px;letter-spacing:-.015em}
.ahead .meta{display:flex;gap:18px;color:rgba(255,255,255,.78);font-size:14px;padding-bottom:26px}
.ahead .img{aspect-ratio:21/8;border-radius:8px 8px 0 0;overflow:hidden;background:var(--sand);margin-bottom:-1px}.ahead img{width:100%;height:100%;object-fit:cover}
.prog{position:sticky;top:0;z-index:5;height:46px;background:rgba(246,239,227,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center}
.prog .wrap{display:flex;gap:22px;overflow-x:auto;white-space:nowrap;width:100%}.prog a{font:600 13px var(--sans);text-decoration:none;color:var(--muted)}
.prog i{position:absolute;left:0;bottom:-1px;height:2px;background:var(--cta);width:30%}
.body{max-width:700px;margin:40px auto 0}.body h2{font:600 30px/1.15 var(--serif);margin:44px 0 10px;color:var(--olive);scroll-margin-top:70px}
.body h3{font:700 19px var(--sans);margin:28px 0 6px}.body p{margin:0 0 18px}.body a{text-decoration-color:var(--cta);text-underline-offset:4px}.body img{max-width:100%;height:auto}
.next{margin-top:70px;background:var(--olive);color:#fff}
.next a{display:grid;grid-template-columns:1fr 340px;gap:40px;align-items:center;padding:46px 0;text-decoration:none}
.next h2{margin:8px 0 0;font:600 clamp(28px,3.6vw,46px)/1.05 var(--serif)}.next .t{aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--beige)}.next img{width:100%;height:100%;object-fit:cover}
.next .k{font:700 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--beige)}
.rel{display:grid;grid-template-columns:repeat(3,1fr);gap:0 30px;padding:20px 0 70px}
@media (max-width:820px){.field .g{grid-template-columns:1fr;gap:22px}.feat{grid-template-columns:1fr 1fr;gap:14px}.feat a:first-child{grid-column:1/-1}.feat h2{font-size:18px}
.yr{grid-template-columns:1fr;gap:6px}.yr>h2{font-size:32px}.trk a{grid-template-columns:1fr;gap:4px}.trk .tag{justify-self:start}
.ahead .img{aspect-ratio:4/3;margin:0 -20px -1px;border-radius:0}.next a{grid-template-columns:1fr}.rel{grid-template-columns:1fr}}
</style></head><body><div class="hdr">Hazey</div><main id="app"></main>
<script src="shared.js"></script>
<script>
C.load().then(function(d){var app=document.getElementById("app"),e=C.esc;
function th(x){return '<div class="t">'+(x.img?'<img src="'+e(x.img)+'" alt="'+e(x.alt)+'" loading="lazy">':'')+'</div>';}
function track(x){return '<li><a href="?view=article&a='+x.slug+'"><span class="d">'+C.date(x.date).replace(/ \d{4}$/,"")+'</span><h3>'+e(x.title)+'</h3>'+(x.subs[0]?'<span class="tag">'+e(x.subs[0])+'</span>':'<span></span>')+'</a></li>';}
if(d.view==="index"){var L=d.list,by={};L.forEach(function(x){(by[x.date.slice(0,4)]=by[x.date.slice(0,4)]||[]).push(x);});
 app.innerHTML='<section class="field"><div class="wrap"><div class="g"><div><h1>Kunskapsbanken</h1><p>Alla '+L.length+' artiklar från Hazey – sök på en cannabinoid, ett format eller en fråga.</p></div><label class="srch"><input type="search" placeholder="Sök bland artiklarna…" aria-label="Sök artiklar"></label></div>'+
 '<div class="tabs" role="toolbar" aria-label="Ämnen"><button aria-pressed="true">Alla<small>'+L.length+'</small></button>'+d.topics.map(function(t){return '<button aria-pressed="false">'+e(t.name)+'<small>'+t.count+'</small></button>';}).join("")+'</div></div></section>'+
 '<div class="wrap"><div class="feat">'+L.filter(function(x){return x.img;}).slice(0,3).map(function(x){return '<a href="?view=article&a='+x.slug+'">'+th(x)+'<div><span class="d">'+C.date(x.date)+' · '+x.min+' min</span><h2>'+e(x.title)+'</h2></div></a>';}).join("")+'</div>'+
 Object.keys(by).sort().reverse().map(function(y){return '<section class="yr"><h2>'+y+'</h2><ul class="trk">'+by[y].map(track).join("")+'</ul></section>';}).join("")+'</div>';
}else{var a=d.art;
 app.innerHTML='<header class="ahead"><div class="wrap"><div class="crumb">Hem / Kunskapsbanken / '+e(a.subs[0]||"Fördjupning")+'</div><h1>'+e(a.title)+'</h1><div class="meta"><span>'+C.date(a.date)+'</span><span>'+a.min+' min läsning</span><span>Hazey</span></div>'+(a.img?'<div class="img"><img src="'+e(a.img)+'" alt="'+e(a.alt)+'"></div>':'')+'</div></header>'+
 '<nav class="prog" aria-label="Innehåll"><div class="wrap"></div><i></i></nav><div class="wrap"><article class="body">'+d.body+'</article></div>'+
 (d.next?'<section class="next"><div class="wrap"><a href="?view=article&a='+d.next.slug+'"><div><span class="k">Nästa artikel</span><h2>'+e(d.next.title)+'</h2></div>'+th(d.next)+'</a></div></section>':'')+
 '<div class="wrap"><ul class="trk rel">'+d.list.filter(function(x){return x!==a&&x!==d.next;}).slice(0,6).map(track).join("")+'</ul></div>';
 var t=C.toc(app.querySelector(".body"));app.querySelector(".prog .wrap").innerHTML=t.map(function(h){return '<a href="#'+h.id+'">'+e(h.text)+'</a>';}).join("");
 var bar=app.querySelector(".prog i"),b=app.querySelector(".body");addEventListener("scroll",function(){var r=b.getBoundingClientRect();bar.style.width=Math.max(0,Math.min(100,(-r.top+60)/(r.height-innerHeight+60)*100))+"%";},{passive:true});
}});
</script></body></html>
