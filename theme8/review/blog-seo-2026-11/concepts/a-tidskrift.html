<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koncept A – Tidskrift</title>
<style>
:root{--ink:#23231d;--olive:#323d25;--sand:#efe2cd;--paper:#fbf6ec;--bg:#ede9e8;--rust:#a5582a;--muted:#5f5848;--line:rgba(35,35,29,.14);--serif:"Iowan Old Style",Georgia,serif;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--sans)}
a{color:inherit}.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
.hdr{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;font:600 20px var(--serif);color:var(--olive);background:var(--bg)}
.kick{font:700 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
/* INDEX */
.ix-head{padding:44px 0 26px;display:grid;gap:14px}
.ix-head h1{margin:0;font:600 clamp(44px,7vw,92px)/.95 var(--serif);letter-spacing:-.02em;color:var(--olive)}
.ix-head p{margin:0;max-width:560px;color:var(--muted)}
.chips{display:flex;gap:6px 18px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:34px}
.chips button{background:none;border:0;padding:6px 0;font:700 14px var(--sans);color:var(--muted);cursor:pointer}
.chips button[aria-pressed=true]{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rust);text-underline-offset:6px}
.chips small{font-weight:400;margin-left:4px}
.lead{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:end;padding-bottom:40px;border-bottom:1px solid var(--line);text-decoration:none}
.lead .m{aspect-ratio:4/3;overflow:hidden;border-radius:4px;background:var(--sand)}.lead img{width:100%;height:100%;object-fit:cover;display:block}
.lead h2{font:600 clamp(30px,3.6vw,52px)/1.02 var(--serif);margin:12px 0 14px;letter-spacing:-.01em}
.lead p{margin:0 0 16px;color:var(--muted)}
.meta{font:400 13px var(--sans);color:var(--muted)}
.list{display:grid;grid-template-columns:repeat(2,1fr);column-gap:56px}
.row{display:grid;grid-template-columns:56px 1fr 120px;gap:18px;padding:22px 0;border-bottom:1px solid var(--line);text-decoration:none;align-items:start}
.row .n{font:600 28px/1 var(--serif);color:var(--rust)}
.row h3{margin:0 0 6px;font:600 21px/1.18 var(--serif)}
.row p{margin:0;font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .t{aspect-ratio:1;border-radius:3px;overflow:hidden;background:var(--sand);display:grid;place-items:center;font:600 18px var(--serif);color:var(--olive)}
.row .t img{width:100%;height:100%;object-fit:cover}
.more{display:flex;justify-content:center;padding:36px 0 70px}.more button{font:700 15px var(--sans);background:var(--olive);color:#fff;border:0;border-radius:4px;padding:14px 26px}
/* ARTIKEL */
.ah{padding:46px 0 24px;max-width:860px;margin:0 auto;text-align:center}
.ah h1{font:600 clamp(36px,5.4vw,68px)/1.02 var(--serif);margin:14px 0 18px;color:var(--olive);letter-spacing:-.015em}
.hero{max-width:1100px;margin:0 auto 40px;aspect-ratio:21/9;overflow:hidden;border-radius:4px;background:var(--sand)}.hero img{width:100%;height:100%;object-fit:cover}
.agrid{display:grid;grid-template-columns:220px minmax(0,680px) 220px;gap:48px;justify-content:center}
.toc{position:sticky;top:24px;align-self:start;font-size:14px;border-top:2px solid var(--olive);padding-top:12px}
.toc a{display:block;padding:6px 0;text-decoration:none;color:var(--muted)}.toc a:hover{color:var(--ink)}
.body h2{font:600 30px/1.15 var(--serif);margin:46px 0 12px;color:var(--olive)}.body h3{font:600 22px/1.2 var(--serif);margin:30px 0 8px}
.body p{margin:0 0 18px}.body a{text-decoration-color:var(--rust);text-underline-offset:4px}.body img{max-width:100%;height:auto;border-radius:4px}
.body>p:first-of-type{font-size:21px;line-height:1.55}
.pn{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:60px 0 0}
.pn a{padding:30px 24px;text-decoration:none}.pn a+a{border-left:1px solid var(--line);text-align:right}
.pn b{display:block;font:600 24px/1.15 var(--serif);margin-top:8px}
.rail-h{display:flex;justify-content:space-between;align-items:end;margin:56px 0 18px}.rail-h h2{margin:0;font:600 34px var(--serif);color:var(--olive)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:60px}
.rail a{scroll-snap-align:start;text-decoration:none}.rail .t{aspect-ratio:3/2;border-radius:3px;overflow:hidden;background:var(--sand);margin-bottom:12px;display:grid;place-items:center;font:600 22px var(--serif);color:var(--olive)}.rail img{width:100%;height:100%;object-fit:cover}
.rail h3{font:600 19px/1.2 var(--serif);margin:6px 0}
@media (max-width:820px){
 .lead{grid-template-columns:1fr;gap:18px}.list{grid-template-columns:1fr}.row{grid-template-columns:36px 1fr 84px;gap:12px}.row .n{font-size:22px}
 .agrid{grid-template-columns:1fr}.toc{position:static;margin-bottom:6px}.toc.side2{display:none}
 .hero{aspect-ratio:4/3;margin:0 -20px 28px;border-radius:0}.ah{text-align:left;padding-top:28px}
 .pn{grid-template-columns:1fr}.pn a+a{border-left:0;border-top:1px solid var(--line);text-align:left}.rail{grid-auto-columns:78%}
}
</style></head><body><div class="hdr">Hazey</div><main class="wrap" id="app"></main>
<script src="shared.js"></script>
<script>
C.load().then(function(d){var app=document.getElementById("app"),e=C.esc;
function thumb(x,cls){return '<div class="'+cls+'">'+(x.img?'<img src="'+e(x.img)+'" alt="'+e(x.alt)+'" loading="lazy">':e((x.subs[0]||"Hazey")))+'</div>';}
if(d.view==="index"){var L=d.list,f=L[0];
 app.innerHTML='<header class="ix-head"><span class="kick">Hazey Journal</span><h1>Guider &amp; fördjupning</h1><p>'+L.length+' artiklar om cannabinoider, lagstiftning och produkter – samlade och sökbara.</p></header>'+
 '<nav class="chips" aria-label="Ämnen"><button aria-pressed="true">Alla <small>'+L.length+'</small></button>'+d.topics.map(function(t){return '<button aria-pressed="false">'+e(t.name)+' <small>'+t.count+'</small></button>';}).join("")+'</nav>'+
 '<a class="lead" href="?view=article&a='+f.slug+'">'+thumb(f,"m")+'<div><span class="kick">Senaste</span><h2>'+e(f.title)+'</h2><p>'+e(f.lead)+'</p><span class="meta">'+C.date(f.date)+' · '+f.min+' min läsning</span></div></a>'+
 '<div class="list">'+L.slice(1,13).map(function(x,i){return '<a class="row" href="?view=article&a='+x.slug+'"><span class="n">'+String(i+2).padStart(2,"0")+'</span><div><h3>'+e(x.title)+'</h3><p>'+e(x.lead)+'</p><span class="meta">'+C.date(x.date)+' · '+x.min+' min</span></div>'+thumb(x,"t")+'</a>';}).join("")+'</div>'+
 '<div class="more"><button>Visa fler artiklar ('+(L.length-13)+')</button></div>';
}else{var a=d.art;
 app.innerHTML='<header class="ah"><span class="kick">'+e((a.subs[0]||"Fördjupning"))+'</span><h1>'+e(a.title)+'</h1><span class="meta">Hazey · '+C.date(a.date)+' · '+a.min+' min läsning</span></header>'+
 (a.img?'<div class="hero"><img src="'+e(a.img)+'" alt="'+e(a.alt)+'"></div>':'')+
 '<div class="agrid"><nav class="toc" aria-label="Innehåll"></nav><article class="body">'+d.body+'</article><div class="toc side2"></div></div>'+
 '<nav class="pn">'+(d.prev?'<a href="?view=article&a='+d.prev.slug+'"><span class="kick">← Föregående</span><b>'+e(d.prev.title)+'</b></a>':'<span></span>')+(d.next?'<a href="?view=article&a='+d.next.slug+'"><span class="kick">Nästa →</span><b>'+e(d.next.title)+'</b></a>':'')+'</nav>'+
 '<div class="rail-h"><h2>Läs vidare</h2><a class="meta" href="?view=index">Alla artiklar →</a></div><div class="rail">'+d.list.filter(function(x){return x!==a;}).slice(0,8).map(function(x){return '<a href="?view=article&a='+x.slug+'">'+thumb(x,"t")+'<span class="meta">'+C.date(x.date)+'</span><h3>'+e(x.title)+'</h3></a>';}).join("")+'</div>';
 var t=C.toc(app.querySelector(".body"));app.querySelector(".toc").innerHTML='<span class="kick">I artikeln</span>'+t.map(function(h){return '<a href="#'+h.id+'">'+e(h.text)+'</a>';}).join("");
}});
</script></body></html>
