<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Koncept C – Läsflöde</title>
<style>
:root{--ink:#23231d;--olive:#323d25;--beige:#e4d1bf;--sand:#efe2cd;--paper:#fbf6ec;--bg:#ede9e8;--cta:#b5581f;--muted:#5f5848;--line:rgba(35,35,29,.14);--serif:"Iowan Old Style",Georgia,serif;--sans:Arial,Helvetica,sans-serif}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,var(--sand),var(--paper) 520px);color:var(--ink);font:400 17px/1.6 var(--sans)}a{color:inherit}
.hdr{height:64px;display:flex;align-items:center;justify-content:center;font:600 20px var(--serif);color:var(--olive)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
/* INDEX: bildledd bento + ämnesrader som vågräta läsrader */
.top{display:flex;justify-content:space-between;align-items:end;gap:20px;padding:30px 0 22px}
.top h1{margin:0;font:600 clamp(40px,5.6vw,74px)/.98 var(--serif);color:var(--olive);letter-spacing:-.02em}
.top p{margin:0;max-width:360px;color:var(--muted);font-size:15px}
.bento{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:260px 260px;gap:14px}
.card{position:relative;border-radius:14px;overflow:hidden;background:var(--olive);color:#fff;text-decoration:none;display:flex;align-items:flex-end}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(20,22,14,.78))}
.card .c{position:relative;z-index:1;padding:18px}.card h2{margin:4px 0 0;font:600 22px/1.12 var(--serif)}
.card.big{grid-row:span 2}.card.big h2{font-size:clamp(28px,3vw,42px)}
.card.txt{background:var(--beige);color:var(--ink)}.card.txt::after{display:none}
.k{font:700 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.shelf{margin-top:46px}.shelf-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.shelf-h h2{margin:0;font:600 30px var(--serif);color:var(--olive)}.shelf-h span{font-size:14px;color:var(--muted)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3*16px)/4);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px}
.mini{scroll-snap-align:start;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.mini .t{aspect-ratio:16/10;background:var(--sand);display:grid;place-items:center;font:600 22px var(--serif);color:var(--olive)}.mini img{width:100%;height:100%;object-fit:cover}
.mini .c{padding:12px 14px 16px}.mini h3{margin:4px 0 0;font:600 17px/1.25 var(--serif)}.m{font-size:12px;color:var(--muted)}
/* ARTIKEL: omslag + kontinuerligt flöde till nästa artikel */
.cover{position:relative;min-height:min(78vh,720px);display:flex;align-items:flex-end;border-radius:0 0 22px 22px;overflow:hidden;background:var(--olive);color:#fff}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,22,14,.1),rgba(20,22,14,.82))}
.cover .wrap{position:relative;z-index:1;padding-bottom:46px;width:100%}.cover h1{font:600 clamp(36px,5.6vw,76px)/1 var(--serif);margin:12px 0 16px;max-width:920px;letter-spacing:-.015em}
.cover .m{color:rgba(255,255,255,.82);font-size:14px}
.read{display:grid;grid-template-columns:minmax(0,680px) 260px;gap:60px;justify-content:center;padding-top:44px}
.body h2{font:600 30px/1.15 var(--serif);margin:44px 0 10px;color:var(--olive)}.body h3{font:600 21px var(--serif);margin:28px 0 6px}.body p{margin:0 0 18px}.body img{max-width:100%;height:auto;border-radius:10px}.body a{text-decoration-color:var(--cta);text-underline-offset:4px}
.aside{position:sticky;top:20px;align-self:start;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px}
.aside a{display:block;font-size:14px;padding:5px 0;text-decoration:none;color:var(--muted)}
.upnext{margin:70px auto 0;max-width:1240px;padding:0 20px 80px}
.upnext .card{height:340px;border-radius:18px}.upnext .card h2{font-size:clamp(28px,3.4vw,46px)}
.cue{text-align:center;font:700 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
@media (max-width:820px){.top{display:block}.top p{margin-top:10px}.bento{grid-template-columns:1fr 1fr;grid-template-rows:300px 190px 190px}.card.big{grid-column:1/-1;grid-row:auto}.card h2{font-size:17px}
.rail{grid-auto-columns:72%}.cover{min-height:68vh;border-radius:0 0 16px 16px}.read{grid-template-columns:1fr;gap:0}.aside{position:static;order:-1;margin-bottom:10px}.upnext .card{height:300px}}
</style></head><body><div class="hdr">Hazey</div><main id="app"></main>
<script src="shared.js"></script>
<script>
C.load().then(function(d){var app=document.getElementById("app"),e=C.esc;
function card(x,cls){return '<a class="card '+(cls||"")+(x.img?"":" txt")+'" href="?view=article&a='+x.slug+'">'+(x.img?'<img src="'+e(x.img)+'" alt="'+e(x.alt)+'" loading="lazy">':'')+'<div class="c"><span class="k">'+e(x.subs[0]||"Fördjupning")+' · '+x.min+' min</span><h2>'+e(x.title)+'</h2></div></a>';}
function mini(x){return '<a class="mini" href="?view=article&a='+x.slug+'"><div class="t">'+(x.img?'<img src="'+e(x.img)+'" alt="'+e(x.alt)+'" loading="lazy">':e(x.subs[0]||"Hazey"))+'</div><div class="c"><span class="m">'+C.date(x.date)+'</span><h3>'+e(x.title)+'</h3></div></a>';}
if(d.view==="index"){var L=d.list,im=L.filter(function(x){return x.img;});
 app.innerHTML='<div class="wrap"><div class="top"><h1>Guider &amp;<br>fördjupning</h1><p>Lagstiftning, cannabinoider och format – förklarat av Hazey. '+L.length+' artiklar.</p></div>'+
 '<div class="bento">'+card(im[0],"big")+im.slice(1,5).map(function(x){return card(x);}).join("")+'</div>'+
 d.topics.slice(0,4).map(function(t){var xs=L.filter(function(x){return x.subs.indexOf(t.name)>-1;});return '<section class="shelf"><div class="shelf-h"><h2>'+e(t.name)+'</h2><span>'+xs.length+' artiklar · Visa alla →</span></div><div class="rail">'+xs.slice(0,10).map(mini).join("")+'</div></section>';}).join("")+'</div>';
}else{var a=d.art;
 app.innerHTML='<header class="cover">'+(a.img?'<img src="'+e(a.img)+'" alt="'+e(a.alt)+'">':'')+'<div class="wrap"><span class="k">'+e(a.subs[0]||"Fördjupning")+'</span><h1>'+e(a.title)+'</h1><span class="m">'+C.date(a.date)+' · '+a.min+' min läsning · Hazey</span></div></header>'+
 '<div class="wrap read"><article class="body">'+d.body+'</article><aside class="aside"><span class="k" style="color:var(--muted)">I artikeln</span><nav></nav></aside></div>'+
 '<section class="upnext"><div class="cue">Fortsätt läsa ↓</div>'+(d.next?card(d.next):"")+'<div class="shelf"><div class="rail">'+d.list.filter(function(x){return x!==a&&x!==d.next;}).slice(0,8).map(mini).join("")+'</div></div></section>';
 var t=C.toc(app.querySelector(".body"));app.querySelector(".aside nav").innerHTML=t.map(function(h){return '<a href="#'+h.id+'">'+e(h.text)+'</a>';}).join("");
}});
</script></body></html>
