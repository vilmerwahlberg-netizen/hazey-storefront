<!-- Theme 8 development loader. Paste this as the ONLY content of the
     JavaScript field in a NEW, INACTIVE Nyehandel theme. Never use it in
     Theme 6 or a published theme. -->
<script>
(function () {
  var html = document.documentElement;
  var BASE = "https://vilmerwahlberg-netizen.github.io/hazey-storefront/theme8/";
  var BUST = "?t=" + Date.now();

  window.HZ8_ASSET_BASE = BASE + "assets/";

  if (document.querySelector("[data-hz8-dev-css]") || document.querySelector("[data-hz8-dev-js]")) {
    return;
  }

  /* Boot mask: Nyehandel shows <body> on DOMContentLoaded, long before
     Theme 8 CSS/JS arrive. Until 00-bootstrap.js removes hz8-boot, only
     the plain Theme 8 canvas (--hz8-bg) is painted -- no native or legacy
     layout. Fail-open: CSS error, JS error, a bundle that never boots or
     the timeout all release the mask. */
  var mask = document.createElement("style");
  mask.setAttribute("data-hz8-boot", "1");
  mask.textContent = "html.hz8-boot{background:#ede9e8!important}" +
    "html.hz8-boot body{visibility:hidden!important;opacity:0!important}";
  document.head.appendChild(mask);
  html.classList.add("hz8-boot");

  function release() { html.classList.remove("hz8-boot"); }
  setTimeout(release, 6000);

  function loadScript() {
    if (document.querySelector("[data-hz8-dev-js]")) return;
    var script = document.createElement("script");
    script.setAttribute("data-hz8-dev-js", "1");
    script.src = BASE + "hazey-theme8.min.js" + BUST;
    script.onload = function () {
      /* 00-bootstrap.js boots on DOMContentLoaded (or the next tick) and
         removes hz8-boot itself; if the bundle threw before that, release. */
      function check() { setTimeout(release, 100); }
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", check, { once: true });
      } else {
        check();
      }
    };
    script.onerror = function () {
      release();
      console.error("[Hazey Theme 8] JavaScript could not be loaded.");
    };
    document.head.appendChild(script);
  }

  var link = document.createElement("link");
  link.setAttribute("data-hz8-dev-css", "1");
  link.rel = "stylesheet";
  link.href = BASE + "hazey-theme8.css" + BUST;
  link.onload = loadScript;
  link.onerror = function () {
    /* Without its CSS, Theme 8 JS would inject unstyled markup on top of
       the native page; show the plain native page instead. */
    release();
    console.error("[Hazey Theme 8] CSS could not be loaded; native page remains available.");
  };
  document.head.appendChild(link);
})();
</script>
