<!--
  Hazey — native header, Nyehandel template 8 "Header" field.

  Uses documented native slots: [#logo] [#navbar] [#search]
  [#account-icon] [#basket-icon] [#hamburger] [#mobile-search].
  Nyehandel substitutes each slot with its own real, already-working
  component (native search, nav + dropdowns, account, cart, mobile
  menu trigger, mobile search) — nothing here clones, moves, or
  rebuilds that markup. This file only supplies the surrounding layout
  (one responsive flex tree, no separate desktop/mobile trees) and
  wraps each slot in a lightly-styled container so it lines up with
  Hazey's brand colors/type (see hazey-tokens.css / hazey-header.css,
  pasted separately into Nyehandel's CSS field). Slots may be placed
  inside their own HTML wrappers — confirmed directly in template 8.

  [#hamburger] is NOT placed inside our own <button> — the slot
  component renders its own interactive element, so it sits in a
  neutral wrapper instead (no nested/duplicate interactive control).
  Same reasoning for [#navbar]: it can render its own <nav> internally,
  so it sits in a neutral <div> here rather than a <nav> we add
  ourselves — no risk of a nested/duplicate navigation landmark.
-->
<header class="hz-header">
  <div class="hz-header__row">
    <div class="hz-header__hamburger">
      [#hamburger]
    </div>

    <div class="hz-header__brand">
      [#logo]
    </div>

    <div class="hz-header__nav">
      [#navbar]
    </div>

    <div class="hz-header__actions">
      <div class="hz-header__search">
        [#search]
      </div>
      <div class="hz-header__account">
        [#account-icon]
      </div>
      <div class="hz-header__basket">
        [#basket-icon]
      </div>
    </div>
  </div>

  <div class="hz-header__mobile-search-row">
    [#mobile-search]
  </div>
</header>
